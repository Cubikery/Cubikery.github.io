<!DOCTYPE html>
<html lang="en">
<head>
    <!-- encoding method -->
    <meta charset="UTF-8" />
    <!-- settings for the responsive size-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title-->
    <title>Staff Locator</title>
    <!-- link for css-->
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <!-- main container -->
    <div class="app-shell">
        <!-- Header -->
        <div class="header">
            <!-- left side of header:clock -->
            <div class="header-left">
                <div class="header-clock">
                    <span class="clock" id="liveClock">--:--:--</span>
                    <span class="date" id="dayDateDisplay"></span>
                </div>
            </div>

            <!-- center of header:school name and title -->
            <div class="header-center">
                <h1>Staff Locator</h1>
                <p class="header-sub">Saint Kentigern College</p>
            </div>

            <!-- right side of hearer: status and login -->
            <div class="header-right">
                <span class="pill pill-neutral" id="headerDayBadge">Day –</span>
                <span class="pill pill-neutral" id="headerStatusBadge">—</span>
                <button class="login-btn" id="loginBtn">Login</button>
            </div>
        </div>

        <!-- main content -->
        <div class="page-content">
            <div class="dashboard">
                <!-- left side: teachers list -->
                <div class="teacher-panel">
                    <div class="panel-title">
                        Teachers
                    </div>
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
                            <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search..." />
                        <button class="clear" id="clearSearchBtn">×</button>
                    </div>
                    <div class="teacher-list" id="teacherListContainer">
                        <div class="loading">Loading teachers...</div>
                    </div>
                </div>

                <!-- left side: teachers timetable -->
                <div class="timetable-panel" id="dropZonePanel">
                    <!-- teachers timetable header and clear button -->
                    <div class="timetable-header">
                        <div class="selected" id="selectedTeacherName">Select a teacher</div>
                        <button class="clear-btn" id="clearListBtn">Clear</button>
                    </div>

                    <!-- teacher's current status-->
                    <div class="status" id="statusDisplay">

                    </div>

                    <!-- teachers timetable-->
                    <div class="timetable-list" id="timetableView">
                        <div class="drop-msg">
                            <div class="main">Click or drag a teacher to view location</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer>
                Staff Locator
            </footer>
        </div>
    </div>

    <!-- javascript link-->
    <script src="index.js"></script>
</body>
</html>
